<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10291f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Slice your way through the Backyard Dojo. Play Classic, Arcade, and Zen with juicy combos, colorful blades, and explosive surprises.">
  <title>Juice Dojo</title>
  <link rel="icon" href="TemplateData/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="TemplateData/logo.png">
  <link rel="manifest" href="TemplateData/dojo.webmanifest">
  <style>
    @font-face{font-family:Dojo;src:url('TemplateData/LilitaOne.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1e16;color:#fff0be}
    body{font-family:Dojo,system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
    #display{position:fixed;inset:0;height:100vh;height:100dvh;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:linear-gradient(#071c14e8,#071c14e8),url('TemplateData/orchard.png') center/cover}
    #display:fullscreen{width:100%;height:100%}
    #display:-webkit-full-screen{width:100%;height:100%}
    .game{position:relative;width:min(100%,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*2.17));width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*2.17));aspect-ratio:217/100;overflow:hidden;background:#10291f}
    #unity-canvas{display:block;width:100%;height:100%;background:#10291f;touch-action:none;outline:none}
    #loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2.2%;background:linear-gradient(#072418cc,#072418e8),url('TemplateData/orchard.png') center/cover;transition:opacity .35s ease}
    #loader.ready{opacity:0;pointer-events:none}
    .eyebrow{font-size:clamp(10px,1.3vw,20px);letter-spacing:.13em;color:#d9ce99;margin:0}
    .logo{display:block;object-fit:contain;width:43%;max-height:49%;filter:drop-shadow(0 7px 0 #091d1466)}
    .card{width:39%;padding:2% 2.2%;background:#d8b77a;color:#3c2b1b;transform:rotate(-1deg);box-shadow:0 7px 0 #6b4b29,0 12px 20px #0004;clip-path:polygon(1% 1%,98% 0,100% 9%,99% 96%,2% 100%,0 90%)}
    #status{margin:0 0 12px;text-align:center;font-size:clamp(10px,1.35vw,21px)}
    .track{height:14px;background:#49301d;overflow:hidden;clip-path:polygon(0 8%,99% 0,100% 92%,1% 100%)}
    #progress{height:100%;width:0;background:#a5ca43;transition:width .15s linear;box-shadow:inset 0 3px 0 #c4de78}
    .tip{margin:1.5% 20px 0;text-align:center;font:clamp(10px,1.1vw,17px) system-ui,sans-serif;color:#dfd5b5}
    #rotate{display:none;justify-items:center;align-content:center;gap:16px;position:absolute;inset:0;text-align:center;padding:24px}
    #rotate img{width:min(72vw,300px);max-height:26vh;object-fit:contain}
    #rotate h1{margin:0;font-size:clamp(25px,7vw,38px);line-height:1.1}
    #rotate p{margin:0;font:17px/1.5 system-ui,sans-serif;color:#dfd5b5}
    #fullscreen{position:absolute;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:48px;height:48px;display:grid;place-items:center;z-index:3;border:2px solid #3c2b1b;border-radius:5px;background:#d5b479;color:#3c2b1b;cursor:pointer;box-shadow:0 3px 0 #543c24;touch-action:manipulation}
    #fullscreen svg{width:24px;height:24px;pointer-events:none}
    #fullscreen[aria-pressed="true"] .enter,#fullscreen[aria-pressed="false"] .exit{display:none}
    #fullscreen:active{transform:translateY(2px);box-shadow:0 1px 0 #543c24}
    #fullscreen:focus-visible{outline:3px solid #b9e76a;outline-offset:3px}
    [hidden]{display:none!important}
    #error{display:none;position:absolute;inset:10%;z-index:5;background:#10291ff5;padding:5%;text-align:center;place-content:center;border:4px solid #ba9b61;font-family:system-ui,sans-serif}
    #error p{line-height:1.5;max-width:36em;margin:1em auto}#retry{padding:12px 24px;font:20px Dojo;border:2px solid #3c2b1b;background:#a5ca43;cursor:pointer}
    @media(max-height:500px){.tip{display:none}.track{height:9px}#status{margin-bottom:6px}}
    @media(orientation:portrait){.game{visibility:hidden;width:100%;height:100%;aspect-ratio:auto}#rotate{display:grid}}
    @media(prefers-reduced-motion:reduce){#loader,#progress{transition:none}}
  </style>
</head>
<body>
  <div id="display">
  <main class="game" aria-label="Juice Dojo game">
    <canvas id="unity-canvas" width="1953" height="900" tabindex="0" aria-label="Swipe through fruit to slice. Use the pause button to take a break."></canvas>
    <div id="loader" role="status" aria-live="polite">
      <p class="eyebrow">WELCOME TO THE DOJO</p>
      <img class="logo" src="TemplateData/logo.png" alt="Juice Dojo" width="1585" height="992">
      <div class="card"><p id="status">OPENING THE GARDEN… 0%</p><div class="track" role="progressbar" aria-label="Game download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div></div>
      <p class="tip">DOJO TIP: Slice three fruit in one stroke for a combo bonus.</p>
    </div>
    <div id="error" role="alert"><h1>The garden couldn't open.</h1><p id="error-message">Check your connection and try again.</p><button id="retry" type="button">TRY AGAIN</button></div>
  </main>
  <section id="rotate" aria-label="Landscape mode">
    <img src="TemplateData/logo.png" alt="Juice Dojo">
    <h1>TURN SIDEWAYS TO PLAY</h1>
    <p>Rotate your device to landscape.</p>
  </section>
  <button id="fullscreen" type="button" aria-label="Fullscreen" aria-pressed="false" title="Enter fullscreen" hidden>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path class="enter" d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/>
      <path class="exit" d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/>
    </svg>
  </button>
  </div>
  <script>
    const canvas=document.querySelector('#unity-canvas');
    const loader=document.querySelector('#loader');
    const bar=document.querySelector('#progress');
    const status=document.querySelector('#status');
    const track=document.querySelector('.track');
    const display=document.querySelector('#display');
    const fullscreen=document.querySelector('#fullscreen');
    const portrait=matchMedia('(orientation: portrait)');
    const enter=document.fullscreenEnabled && display.requestFullscreen
      ? display.requestFullscreen.bind(display)
      : document.webkitFullscreenEnabled && display.webkitRequestFullscreen?.bind(display);
    const exit=(document.exitFullscreen || document.webkitExitFullscreen)?.bind(document);
    const isFullscreen=()=>(document.fullscreenElement || document.webkitFullscreenElement)===display;
    let game;
    let fullscreenAttempted=false;
    let orientationRequested=false;
    function focusPlayfield(){
      if(!game)return;
      if(!portrait.matches && document.activeElement===document.body)canvas.focus();
    }
    async function syncFullscreen(){
      const active=isFullscreen();
      fullscreen.setAttribute('aria-pressed',String(active));
      fullscreen.title=active?'Exit fullscreen':'Enter fullscreen';
      if(active && !orientationRequested && screen.orientation?.lock){
        orientationRequested=true;
        try{await screen.orientation.lock('landscape');}catch{/* The rotate screen handles devices without orientation lock. */}
      }else if(!active && orientationRequested){
        orientationRequested=false;
        screen.orientation?.unlock?.();
      }
    }
    async function toggleFullscreen(){
      fullscreenAttempted=true;
      try{if(isFullscreen())await exit?.();else await enter?.();}
      catch{/* Continue in the available browser viewport. */}
    }
    if(enter){
      fullscreen.hidden=false;
      fullscreen.addEventListener('click',toggleFullscreen);
      // Unity can suppress the synthetic click that follows a touch on the canvas.
      canvas.addEventListener('pointerup',event=>{
        if(event.isTrusted && event.isPrimary && event.button===0 && !fullscreenAttempted && !isFullscreen())toggleFullscreen();
      },{capture:true});
      canvas.addEventListener('keydown',event=>{
        if(event.isTrusted && (event.code==='Enter' || event.code==='Space') && !fullscreenAttempted && !isFullscreen())toggleFullscreen();
      });
      document.addEventListener('fullscreenchange',syncFullscreen);
      document.addEventListener('webkitfullscreenchange',syncFullscreen);
    }
    portrait.addEventListener('change',focusPlayfield);
    function fail(message){document.querySelector('#error-message').textContent=message;document.querySelector('#error').style.display='grid';loader.hidden=true;}
    document.querySelector('#retry').addEventListener('click',()=>location.reload());
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    function progress(value){const percent=Math.round(value*100);bar.style.width=percent+'%';track.setAttribute('aria-valuenow',percent);status.textContent=(percent<55?'GATHERING FRESH FRUIT… ':percent<90?'SHARPENING THE BLADES… ':'OPENING THE DOJO… ')+percent+'%';}
    const script=document.createElement('script');
    script.src='Build/{{{ LOADER_FILENAME }}}';
    script.onerror=()=>fail('The game download was interrupted. Please check your connection and try again.');
    script.onload=()=>createUnityInstance(canvas,{
      dataUrl:'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',
      companyName:'Backyard Dojo',productName:'Juice Dojo',productVersion:'1.3',
      devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
      autoSyncPersistentDataPath:true,
      showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message);}
    },progress).then(instance=>{game=instance;focusPlayfield();progress(1);loader.classList.add('ready');setTimeout(()=>loader.remove(),400);}).catch(error=>{console.error(error);fail('Your browser could not start the game. Try a current Chrome, Edge, Firefox, or Safari browser with hardware acceleration enabled.');});
    document.body.appendChild(script);
  </script>
</body>
</html>
