<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d13">
  <title>CyberScratch 5X</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --viewport-width: 100vw;
      --viewport-height: 100dvh;
      --viewport-left: 0px;
      --viewport-top: 0px;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0d13;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #unity-container {
      position: fixed;
      left: var(--viewport-left, 0px);
      top: var(--viewport-top, 0px);
      width: var(--viewport-width, 100vw);
      height: var(--viewport-height, 100dvh);
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0d13;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      display: block;
      outline: none;
      touch-action: none;
    }
    @media (max-aspect-ratio: 9/16) {
      #unity-canvas {
        width: 100%;
        height: auto;
      }
    }
    @media (min-aspect-ratio: 9/16) {
      #unity-canvas {
        width: auto;
        height: 100%;
      }
    }
    #unity-loading-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #151a28 0%, #080a10 100%);
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .loading-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00e5ff;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
      margin-bottom: 24px;
    }
    #unity-loading-bar {
      width: min(280px, 70vw);
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(0, 229, 255, 0.25);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #ffd700);
      border-radius: 4px;
      transition: width 0.15s ease-out;
      box-shadow: 0 0 10px #00e5ff;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-container">
      <div class="loading-title">CyberScratch 5X</div>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingContainer = document.querySelector("#unity-loading-container");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

    function updateViewport() {
      var v = window.visualViewport;
      var root = document.documentElement;
      var w = v ? v.width : window.innerWidth;
      var h = v ? v.height : window.innerHeight;
      var left = v ? v.offsetLeft : 0;
      var top = v ? v.offsetTop : 0;
      root.style.setProperty('--viewport-width', w + 'px');
      root.style.setProperty('--viewport-height', h + 'px');
      root.style.setProperty('--viewport-left', left + 'px');
      root.style.setProperty('--viewport-top', top + 'px');
    }

    updateViewport();
    window.addEventListener('resize', updateViewport);
    window.addEventListener('orientationchange', updateViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateViewport);
      window.visualViewport.addEventListener('scroll', updateViewport);
    }

    // Unlock WebAudio on iOS / mobile browsers on first interaction
    function unlockAudio() {
      if (typeof (window.AudioContext || window.webkitAudioContext) !== "undefined") {
        var dummyCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (dummyCtx.state === 'suspended') {
          dummyCtx.resume();
        }
      }
      window.removeEventListener('touchstart', unlockAudio);
      window.removeEventListener('pointerdown', unlockAudio);
      window.removeEventListener('click', unlockAudio);
    }
    window.addEventListener('touchstart', unlockAudio, { passive: true });
    window.addEventListener('pointerdown', unlockAudio, { passive: true });
    window.addEventListener('click', unlockAudio);

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        if (progressBarFull) {
          progressBarFull.style.width = (100 * progress) + "%";
        }
      }).then(function (instance) {
        window.unityInstance = instance;
        if (loadingContainer) {
          loadingContainer.style.opacity = "0";
          setTimeout(function () {
            loadingContainer.style.display = "none";
          }, 400);
        }
      }).catch(function (message) {
        console.error(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
