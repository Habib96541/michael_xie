<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#09131f">
    <link rel="icon" href="data:,">
    <title>ShatterLeap</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #09131f; color: #e7ffff; font-family: system-ui, sans-serif; }
        #unity-canvas { position: fixed; left: env(safe-area-inset-left, 0px); top: env(safe-area-inset-top, 0px); width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: block; touch-action: none; outline: none; }
        #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 20px; background: #09131f; }
        #loading img { width: min(80vw, 520px); }
        progress { width: min(80vw, 520px); accent-color: #40e3ce; }
        #fullscreen { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); right: max(8px, env(safe-area-inset-right)); border: 1px solid #4d787a; background: #09131fbb; color: #a6ceca; min-height: 30px; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        #game-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="0" aria-label="ShatterLeap glass bridge memory game"></canvas>
    <div id="loading"><img src="logo.png" alt="ShatterLeap"><div id="load-message">Preparing the bridge...</div><progress max="1" value="0"></progress></div>
    <div id="game-status" aria-live="polite"></div>
    <button id="fullscreen" type="button">Full screen</button>
    <script>
        const canvas = document.getElementById('unity-canvas');
        const loading = document.getElementById('loading');
        const full = document.getElementById('fullscreen');
        full.hidden = !document.fullscreenEnabled;
        full.onclick = async () => {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (error) { full.hidden = true; }
            canvas.focus();
        };
        const loader = document.createElement('script');
        loader.src = 'Build/{{{ LOADER_FILENAME }}}';
        loader.onload = () => createUnityInstance(canvas, {
            dataUrl: 'Build/{{{ DATA_FILENAME }}}',
            frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
            codeUrl: 'Build/{{{ CODE_FILENAME }}}',
            streamingAssetsUrl: 'StreamingAssets',
            companyName: 'ShatterLeap', productName: 'ShatterLeap', productVersion: '0.1.0',
            matchWebGLToCanvasSize: true,
            autoSyncPersistentDataPath: true,
            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
            showBanner: (message, type) => { if (type === 'error') document.getElementById('load-message').textContent = message; }
        }, progress => loading.querySelector('progress').value = progress).then(instance => {
            window.shatterInstance = instance;
            loading.style.display = 'none';
            canvas.focus();
        }).catch(error => document.getElementById('load-message').textContent = 'Unable to start: ' + error);
        loader.onerror = () => document.getElementById('load-message').textContent = 'Build files could not be loaded. Serve this folder through HTTP.';
        document.body.appendChild(loader);
    </script>
</body>
</html>
