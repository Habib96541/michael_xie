<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#160c28">
  <link rel="icon" href="data:,">
  <title>Bullseye Blitz</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #160c28; color: #fff4d2; font-family: Arial, sans-serif; }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 20px; background: #160c28; }
    h1 { color: #ffd052; font-size: clamp(28px, 7vw, 60px); margin: 0; }
    progress { width: 240px; accent-color: #ffd052; justify-self: center; }
    #fullscreen { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); width: 36px; height: 36px; border: 1px solid #b895d0; border-radius: 8px; background: #211138b8; color: #fff; font-size: 22px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Bullseye Blitz carnival shooting game"></canvas>
  <div id="loading"><h1>BULLSEYE BLITZ</h1><span id="status">Opening the carnival…</span><progress id="progress" max="1" value="0"></progress></div>
  <button id="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'BullseyeBlitz', productName: 'Bullseye Blitz', productVersion: '1.0',
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (message, type) => { if (type === 'error') { document.getElementById('status').textContent = message; } }
    };
    const loader = document.createElement('script'); loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onload = () => createUnityInstance(canvas, config, p => { document.getElementById('progress').value = p; }).then(instance => {
      window.blitzInstance = instance;
      document.getElementById('loading').style.display = 'none';
      const pause = () => { try { instance.SendMessage('Bullseye Blitz', 'BrowserHidden'); } catch (_) {} };
      document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
      window.addEventListener('blur', pause);
      document.getElementById('fullscreen').onclick = () => {
        if (document.fullscreenElement) document.exitFullscreen?.(); else instance.SetFullscreen(1);
      };
      canvas.focus();
    }).catch(error => { document.getElementById('status').textContent = 'Unable to open the game. Please reload. ' + error; });
    loader.onerror = () => { document.getElementById('status').textContent = 'Game download failed. Please reload.'; };
    document.body.appendChild(loader);
  </script>
</body>
</html>
