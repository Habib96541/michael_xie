<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PegRush — Find your flow</title><meta name="description" content="A little bounce. A bright possibility. An original virtual-coin arcade game."><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07141e;font-family:Arial,sans-serif;color:#e9f7f9}#unity-canvas{width:100%;height:100%;display:block;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#07141e;z-index:2}h1{font-size:42px;letter-spacing:-2px;margin:0 0 12px}h1 span{color:#4eeaae}.caption{font-size:12px;letter-spacing:3px;color:#89acb8}.track{width:240px;height:3px;border-radius:4px;background:#173341;margin:32px auto 14px}#progress{height:100%;width:0;background:#4eeaae;transition:width .15s}#status{font-size:12px;color:#89acb8}#fullscreen{position:fixed;right:10px;bottom:8px;width:30px;height:30px;background:#173341;border:1px solid #294c58;color:#e9f7f9;border-radius:8px;cursor:pointer;opacity:.7}#fullscreen:hover,#fullscreen:focus{opacity:1;border-color:#4eeaae;outline:none}#fullscreen:before{content:'';display:block;width:12px;height:10px;border:1px solid currentColor;margin:auto}
</style></head><body><canvas id="unity-canvas" tabindex="0" aria-label="PegRush arcade game"></canvas><div id="loading"><h1>PEG<span>RUSH</span> /</h1><div class="caption">FIND YOUR FLOW</div><div class="track"><div id="progress"></div></div><div id="status">Preparing your board</div></div><button id="fullscreen" aria-label="Fullscreen" title="Fullscreen"></button><script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
const canvas=document.querySelector('#unity-canvas');let game;
createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'PegRush Arcade',productName:'PegRush',productVersion:'1.1',matchWebGLToCanvasSize:true},p=>{document.querySelector('#progress').style.width=(p*100)+'%';document.querySelector('#status').textContent='Loading '+Math.round(p*100)+'%'}).then(instance=>{game=instance;document.querySelector('#loading').remove();canvas.focus();}).catch(error=>{document.querySelector('#status').textContent='Unable to load. Please refresh.';console.error(error)});
document.querySelector('#fullscreen').onclick=()=>{if(game)game.SetFullscreen(1)};canvas.addEventListener('pointerdown',()=>canvas.focus());
</script></body></html>
