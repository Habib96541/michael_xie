<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PegRush</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061421;font-family:Arial;color:#c9f9ee}#unity-canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;top:48%;width:100%;text-align:center}#fullscreen{position:absolute;right:8px;bottom:5px;background:#143c49;border:0;color:#c9f9ee;border-radius:6px;padding:6px;opacity:.7}</style></head><body><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading">PEGRUSH · Loading…</div><button id="fullscreen" aria-label="Fullscreen">⛶</button><script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
const canvas=document.querySelector('#unity-canvas');let game;
createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'PegRush Arcade',productName:'PegRush',productVersion:'1.0',matchWebGLToCanvasSize:true},p=>document.querySelector('#loading').textContent='PEGRUSH · '+Math.round(p*100)+'%').then(instance=>{game=instance;document.querySelector('#loading').remove();canvas.focus();}).catch(error=>{document.querySelector('#loading').textContent=error;console.error(error)});
document.querySelector('#fullscreen').onclick=()=>{if(game)game.SetFullscreen(1)};
canvas.addEventListener('pointerdown',()=>canvas.focus());
</script></body></html>
