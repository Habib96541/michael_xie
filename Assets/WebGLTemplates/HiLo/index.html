<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b2028">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2355e6be'/%3E%3Cpath d='M18 31L32 17L46 31M32 17V49' stroke='%2314322d' stroke-width='5' fill='none'/%3E%3C/svg%3E">
  <meta name="description" content="Higher or lower? Follow your instinct in an endless card game. Free virtual coins, fair cards, one more move.">
  <title>HI / LO — One more card.</title>
  <style>
    * { box-sizing: border-box; } html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#0b2028;overscroll-behavior:none; }
    body { color:#eaf0ea;font-family:system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none; }
    #unity-container { width:100%;height:100%;height:100dvh;position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #unity-canvas { display:block;width:100%;height:100%;outline:none;background:#0b2028; }
    #loading { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#183e40,#0b2028 70%);transition:opacity .25s; }
    .mark { width:54px;height:54px;background:#55e6be;color:#12322c;display:grid;place-items:center;font-size:34px;border-radius:12px;margin-bottom:22px; }
    .brand { font-size:25px;font-weight:650;letter-spacing:7px; } .sub { color:#8baba9;font-size:13px;margin-top:12px; }
    .track { width:180px;height:3px;background:#23423f;margin-top:32px;border-radius:3px;overflow:hidden; } #progress { height:100%;width:0;background:#55e6be;transition:width .2s; }
    #error { max-width:340px;padding:20px;color:#f18a7e;text-align:center;white-space:pre-wrap;font-size:14px; }
    #resume { position:absolute;inset:0;background:#081b23ee;color:#eaf0ea;display:none;place-items:center;text-align:center;font-size:18px;pointer-events:none; }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" tabindex="0" aria-label="Hi Lo card game. Up arrow higher, down arrow lower, space cash out. Settings include sound, reduced motion, and timer controls."></canvas>
    <div id="loading" role="status"><div class="mark">↑</div><div class="brand">HI / LO</div><div class="sub">One more card.</div><div class="track"><div id="progress"></div></div><div id="error"></div></div>
    <div id="resume">Paused<br><small>Return to your next move.</small></div>
  </main>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Little Instinct Studio', productName: 'Hi Lo Endless', productVersion: '1.0.0',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      autoSyncPersistentDataPath: true,
      matchWebGLToCanvasSize: true,
      showBanner: (message, type) => { if(type==='error') document.querySelector('#error').textContent=message; }
    };
    window.hiloReady = () => { const loader=document.querySelector('#loading');loader.style.opacity=0;setTimeout(()=>loader.remove(),300);canvas.focus(); };
    const script=document.createElement('script');script.src=buildUrl+'/{{{ LOADER_FILENAME }}}';
    script.onload=()=>createUnityInstance(canvas,config,p=>document.querySelector('#progress').style.width=(p*100)+'%').then(instance=>{
      window.unityInstance=instance;
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) instance.SendMessage('Game','ApplyReducedMotion');
      document.addEventListener('visibilitychange',()=>{instance.SendMessage('Game','SetBrowserFocus',document.hidden?'0':'1');});
    }).catch(error=>{document.querySelector('#error').textContent='Could not load the game. Reload to try again.\n'+error;});
    script.onerror=()=>document.querySelector('#error').textContent='Could not download the game. Please reload.';
    document.body.appendChild(script);
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' ','Tab'].includes(e.key))e.preventDefault();});
    canvas.addEventListener('pointerdown',()=>canvas.focus());
  </script>
</body>
</html>
