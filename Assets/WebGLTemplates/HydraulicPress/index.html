<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#dddad2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23172c37' d='M8 8h48v48H8z'/%3E%3Cpath fill='%23d9934e' d='M17 17h30v5H35v15h10v6H19v-6h10V22H17zm3 32h24v5H20z'/%3E%3C/svg%3E">
  <title>Hydraulic Press</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#dddad2;font-family:system-ui,sans-serif;color:#172c37}
    #game{position:fixed;inset:0;width:100%;height:100%;width:100dvw;height:100dvh;outline:none;touch-action:none;-webkit-user-select:none;user-select:none}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#dddad2;z-index:2;transition:opacity .35s}
    #mark{width:72px;height:76px;border:9px solid #172c37;border-bottom:0;position:relative;margin-bottom:28px}
    #mark:before{content:"";position:absolute;left:22px;top:0;width:11px;height:34px;background:#172c37;animation:press 1.2s ease-in-out infinite alternate}
    #mark:after{content:"";position:absolute;left:6px;top:34px;width:44px;height:12px;background:#d9934e;animation:press 1.2s ease-in-out infinite alternate}
    @keyframes press{to{transform:translateY(15px)}}h1{font-size:14px;letter-spacing:.3em;margin:0 0 22px}#track{height:3px;width:160px;background:#172c3720;border-radius:2px;overflow:hidden}#progress{height:100%;width:0;background:#172c37;transition:width .2s}
    #error{display:none;max-width:300px;padding:20px;font-size:14px;text-align:center}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Hydraulic Press game"></canvas>
  <div id="loader"><div id="mark"></div><h1>HYDRAULIC PRESS</h1><div id="track"><div id="progress"></div></div><div id="error"></div></div>
  <script>
    const canvas=document.getElementById('game');
    const loader=document.getElementById('loader');
    window.hydraulicStatus={state:'Loading'};
    function resize(){canvas.style.left='env(safe-area-inset-left, 0px)';canvas.style.top='env(safe-area-inset-top, 0px)';canvas.style.width='calc('+innerWidth+'px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))';canvas.style.height='calc('+innerHeight+'px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))';}
    addEventListener('resize',resize);resize();
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    canvas.addEventListener('pointerdown',()=>canvas.focus());
    const config={
      dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',companyName:'Copperline Games',productName:'Hydraulic Press',productVersion:'1.0.0',
      devicePixelRatio:Math.min(window.devicePixelRatio||1,2),matchWebGLToCanvasSize:true,autoSyncPersistentDataPath:true,
      showBanner:(message,type)=>{if(type==='error'){document.getElementById('error').style.display='block';document.getElementById('error').textContent=message;}}
    };
    const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
    script.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').style.width=(p*100)+'%').then(instance=>{
      window.hydraulicGame=instance;loader.style.opacity=0;setTimeout(()=>loader.remove(),400);
    }).catch(error=>{document.getElementById('error').style.display='block';document.getElementById('error').textContent='Unable to start the press. Please reload this page. '+error;});
    document.body.appendChild(script);
  </script>
</body>
</html>
