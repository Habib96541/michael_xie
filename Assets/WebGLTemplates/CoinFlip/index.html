<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101827"><meta name="description" content="A little luck. A lovely flip. A playful virtual-coin arcade.">
<title>Coinflip — a little luck</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F5B942'/%3E%3Cpath d='M32 9L38 26L55 32L38 38L32 55L26 38L9 32L26 26Z' fill='%23101827'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#f4f2ea;font-family:system-ui,sans-serif}body{overscroll-behavior:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse at 50% 45%,#202d42,#101827 65%);transition:opacity .35s;z-index:2}.emblem{width:82px;height:82px;border:2px solid #f5b942;border-radius:50%;display:grid;place-items:center;color:#f5b942;font-size:52px;box-shadow:0 0 0 7px #f5b94212}.wordmark{font-size:32px;font-weight:700;letter-spacing:-1px}.tagline{font-size:12px;color:#94a3b8;letter-spacing:3px;text-transform:uppercase}.track{width:180px;height:4px;border-radius:4px;background:#304057;overflow:hidden;margin-top:12px}#bar{width:0%;height:100%;background:#f5b942;transition:width .2s}#status{font-size:12px;color:#94a3b8}#error{display:none;max-width:340px;padding:24px;text-align:center;line-height:1.6;color:#f18d87}.hidden{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="Coinflip game. Pick Heads or Tails, adjust your virtual coin wager, then flip."></canvas></main>
<div id="loading"><div class="emblem">✧</div><div class="wordmark">coinflip</div><div class="tagline">A little luck. A lovely flip.</div><div class="track"><div id="bar"></div></div><div id="status">Warming up your lucky coin…</div><div id="error" role="alert"></div></div>
<script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');
const buildUrl='Build';
function showError(message){document.getElementById('error').style.display='block';document.getElementById('error').textContent=message;document.getElementById('status').textContent='The coin needs another moment. Please reload.';}
const config={dataUrl:buildUrl+'/{{{ DATA_FILENAME }}}',frameworkUrl:buildUrl+'/{{{ FRAMEWORK_FILENAME }}}',codeUrl:buildUrl+'/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Little Orbit',productName:'Coinflip',productVersion:'1.0.0',autoSyncPersistentDataPath:true,matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2),showBanner:(message,type)=>{if(type==='error'){console.error(message);showError(message)}}};
// CSS safe-area insets protect iPhone notches even when the Web player reports a full safe area.
const game=document.getElementById('game');game.style.top='env(safe-area-inset-top,0px)';game.style.right='env(safe-area-inset-right,0px)';game.style.bottom='env(safe-area-inset-bottom,0px)';game.style.left='env(safe-area-inset-left,0px)';
const script=document.createElement('script');script.src=buildUrl+'/{{{ LOADER_FILENAME }}}';
script.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('bar').style.width=(p*100)+'%';}).then(instance=>{window.unityInstance=instance;loading.classList.add('hidden');setTimeout(()=>loading.remove(),400);canvas.focus();}).catch(e=>{console.error(e);showError(String(e));});
script.onerror=()=>showError('The game files could not load. Check your connection, then reload.');document.body.appendChild(script);
document.addEventListener('visibilitychange',()=>{if(window.unityInstance)window.unityInstance.SendMessage('Coin Flip','BrowserVisibility',document.hidden?'hidden':'visible');});
window.addEventListener('pagehide',()=>{if(window.unityInstance)window.unityInstance.SendMessage('Coin Flip','BrowserVisibility','hidden');});
canvas.addEventListener('contextmenu',event=>event.preventDefault());
</script></body></html>
