<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#aacbcd"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23aacbcd'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23101826' stroke='%23f58d73' stroke-width='5'/%3E%3C/svg%3E"><title>Pocket Borough — A little city. A big appetite.</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#aacbcd;overscroll-behavior:none;font-family:system-ui,sans-serif;color:#233d4b;touch-action:none;-webkit-user-select:none;user-select:none}:root{--borough-safe-top:env(safe-area-inset-top,0px);--borough-safe-right:env(safe-area-inset-right,0px);--borough-safe-bottom:env(safe-area-inset-bottom,0px);--borough-safe-left:env(safe-area-inset-left,0px)}#game{position:fixed;inset:var(--borough-safe-top) var(--borough-safe-right) var(--borough-safe-bottom) var(--borough-safe-left)}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#aacbcd;z-index:2}.card{padding:42px;background:#fff8e9;border-radius:24px;width:min(390px,90vw);box-shadow:0 20px 70px #233d4b20}small{letter-spacing:.16em;font-size:11px;font-weight:700}h1{font-size:46px;line-height:.96;letter-spacing:-2px;margin:24px 0}p{font-size:15px;color:#6f8387}#track{height:7px;border-radius:9px;background:#d9ebdf;overflow:hidden;margin-top:26px}#progress{height:100%;width:0;background:#f58d73;transition:width .2s}#error{display:none;line-height:1.5;font-size:14px;color:#a34f40}a{color:inherit}</style></head>
<body><main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="Pocket Borough 3D city game"></canvas></main><div id="loading"><div class="card"><small>A LITTLE CITY. A BIG APPETITE.</small><h1>POCKET<br>BOROUGH</h1><p id="status">Building your neighborhood…</p><div id="track"><div id="progress"></div></div><div id="error"></div></div></div>
<script>
const canvas=document.querySelector('#unity-canvas');const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||navigator.maxTouchPoints>1;
const config={dataUrl:'Build/WebGL.data.unityweb',frameworkUrl:'Build/WebGL.framework.js.unityweb',codeUrl:'Build/WebGL.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Pocket Borough Studio',productName:'Pocket Borough',productVersion:'1.0.0',devicePixelRatio:Math.min(devicePixelRatio,mobile?1.5:2),matchWebGLToCanvasSize:true};
function fail(message){document.querySelector('#status').textContent='The neighborhood could not load.';let error=document.querySelector('#error');error.style.display='block';error.textContent=String(message);}
config.showBanner=(message,type)=>{if(type==='error')fail(message);else console.warn(message)};
const loader=document.createElement('script');loader.src='Build/WebGL.loader.js';loader.onload=()=>createUnityInstance(canvas,config,p=>document.querySelector('#progress').style.width=(p*100)+'%').then(instance=>{window.boroughUnity=instance;pauseForPortrait();document.querySelector('#loading').style.display='none';canvas.focus();}).catch(fail);loader.onerror=()=>fail('Serve this folder through HTTP or HTTPS. Check that all Build files were uploaded.');document.body.appendChild(loader);
canvas.addEventListener('pointerdown',()=>canvas.focus());canvas.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&window.boroughUnity)window.boroughUnity.SendMessage('BoroughGame','BrowserBlur');});
// Native touch cancellation cannot always be cancelled. Preserve delivery to Unity while
// avoiding its generated handler's invalid preventDefault call for this one event.
canvas.addEventListener('touchcancel',event=>{if(!event.cancelable)event.preventDefault=()=>{};},{capture:true,passive:true});
function pauseForPortrait(){if(innerHeight>innerWidth&&window.boroughUnity)window.boroughUnity.SendMessage('BoroughGame','BrowserBlur');}
window.addEventListener('resize',pauseForPortrait);
</script></body></html>
